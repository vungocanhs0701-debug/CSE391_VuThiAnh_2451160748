<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>CSS Transitions & Animations</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>

<header>
    <h1>CSS Transitions & Animations</h1>
</header>

<section class="products fade-in">
    <div class="card">
        <div class="image-box">
            <img src="https://via.placeholder.com/300x200" alt="Product">
        </div>

        <h2>iPhone 16</h2>
        <p>25.990.000đ</p>
        <button>Mua ngay</button>
    </div>

    <div class="card">
        <div class="image-box">
            <img src="https://via.placeholder.com/300x200" alt="Product">
        </div>

        <h2>MacBook Pro</h2>
        <p>45.990.000đ</p>
        <button>Mua ngay</button>
    </div>

    <div class="card">
        <div class="image-box">
            <img src="https://via.placeholder.com/300x200" alt="Product">
        </div>

        <h2>AirPods Pro</h2>
        <p>5.990.000đ</p>
        <button>Mua ngay</button>
    </div>
</section>

<section class="loading-section fade-in">
    <h2>Loading Spinner</h2>
    <div class="spinner"></div>
</section>

</body>
</html>
