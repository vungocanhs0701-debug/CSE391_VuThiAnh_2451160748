<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Page</title>
    <link rel="stylesheet" href="responsive.css">
</head>
<body>

<header class="header">
    <div class="logo">ShopTLU</div>

    <button class="hamburger">☰</button>

    <nav class="nav-menu">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<div class="layout">

    <aside class="sidebar">
        <h2>Bộ lọc</h2>
        <label><input type="checkbox"> Điện thoại</label>
        <label><input type="checkbox"> Laptop</label>
        <label><input type="checkbox"> Phụ kiện</label>
    </aside>

    <main class="product-section">
        <h1>Sản phẩm nổi bật</h1>

        <div class="product-grid">
            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="Product">
                <h3>iPhone 16</h3>
                <p>25.990.000đ</p>
                <button>Mua</button>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="Product">
                <h3>MacBook Pro</h3>
                <p>45.990.000đ</p>
                <button>Mua</button>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="Product">
                <h3>AirPods Pro</h3>
                <p>5.990.000đ</p>
                <button>Mua</button>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="Product">
                <h3>iPad Air</h3>
                <p>16.990.000đ</p>
                <button>Mua</button>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="Product">
                <h3>Apple Watch</h3>
                <p>9.990.000đ</p>
                <button>Mua</button>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="Product">
                <h3>Samsung S24</h3>
                <p>22.990.000đ</p>
                <button>Mua</button>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="Product">
                <h3>Dell XPS</h3>
                <p>32.990.000đ</p>
                <button>Mua</button>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300x200" alt="Product">
                <h3>Logitech Mouse</h3>
                <p>790.000đ</p>
                <button>Mua</button>
            </div>
        </div>
    </main>

    <aside class="ads">
        <h2>ADS</h2>
        <p>Banner quảng cáo</p>
    </aside>

</div>

<footer class="footer">
    <p>&copy; 2026 ShopTLU</p>
</footer>

</body>
</html>
