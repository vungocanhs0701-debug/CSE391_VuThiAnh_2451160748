<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý công việc cá nhân</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Quản lý công việc cá nhân</h1>

    <div class="top-bar">
        <button id="btnAdd">+ Thêm công việc</button>
    </div>

    <div id="message"></div>

    <div class="stats">
        <div>Tổng công việc: <span id="totalTasks">0</span></div>
        <div>Đã hoàn thành: <span id="doneTasks">0</span></div>
        <div>Chưa hoàn thành: <span id="undoneTasks">0</span></div>
    </div>

    <div id="taskList" class="task-list"></div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <h2 id="formTitle">Thêm công việc</h2>

        <form id="taskForm">
            <label>Tiêu đề công việc</label>
            <input type="text" id="title" required>

            <label>Mô tả ngắn</label>
            <textarea id="description" required></textarea>

            <label>Hạn hoàn thành</label>
            <input type="date" id="deadline" required>

            <label>Mức ưu tiên</label>
            <select id="priority">
                <option value="Thấp">Thấp</option>
                <option value="Trung bình">Trung bình</option>
                <option value="Cao">Cao</option>
            </select>

            <label>
                <input type="checkbox" id="completed">
                Đã hoàn thành
            </label>

            <div class="form-actions">
                <button type="submit" id="btnSave">Lưu</button>
                <button type="button" id="btnClose">Hủy</button>
            </div>
        </form>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
